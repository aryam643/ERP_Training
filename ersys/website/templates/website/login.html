{% extends "website/index.html" %}

{% block title %}
<title>Login</title>
{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-r from-neutral-900 via-neutral-800 to-neutral-700">
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-gray-800">Welcome</h2>
        <p class="text-gray-500 text-center mt-2">Login to your account</p>

        <form action="{% url 'login' %}" method="post" class="mt-6 space-y-4">
            {% csrf_token %} 

            <div>
                <label for="email" class="block text-gray-700 font-medium">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>

            <div>
                <label for="password" class="block text-gray-700 font-medium">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>
            
            <button type="submit" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Login
            </button>
        </form>

        <p class="text-center text-gray-600 mt-4">Don't have an account? 
            <a href="{% url 'register' %}" class="text-red-600 font-semibold hover:underline">Register</a>
        </p>

        {% if messages %}
            {% for message in messages %}
                <p class="text-red-500">{{ message }}</p>
            {% endfor %}
        {% endif %}
    </div>
</div>
{% endblock %}
