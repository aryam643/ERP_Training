<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    <title>ERP Home</title>
    {% endblock %}
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
{% block content %}

<body class="bg-gradient-to-r from-neutral-900 via-neutral-800 to-neutral-700 h-screen flex items-center justify-center">
    <div class="text-center space-y-6">
        <h1 class="text-4xl font-bold text-white">Welcome to ERP System</h1>
        <p class="text-gray-200">Manage your tasks efficiently with our platform</p>
        
        <div class="space-x-4">
            <a href="/login" class="px-6 py-3 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-300">
                Login
            </a>
            <a href="/register" class="px-6 py-3 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-300">
                Register
            </a>
        </div>
        
    </div>

</body>
{% endblock %}
</html>
