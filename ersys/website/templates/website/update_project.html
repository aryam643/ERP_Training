{% extends "website/sidebar.html" %}
{% block title %}
<title>Update Project</title>
{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-r from-neutral-900 via-neutral-800 to-neutral-700">
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md">
        <h2 class="text-4xl font-bold text-center text-gray-800 mb-4">Update Project</h2>

        <form class="max-w-lg mx-auto bg-gray-200 p-6 rounded-lg shadow" method="POST">
            {% csrf_token %}
        
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Project Name</label>
                <input type="text" name="project_name" required placeholder="Enter Project Name"
                       value="{{ project.project_name }}" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        
            <div class="mb-4">
                <label for="proj_des" class="block text-gray-700 font-semibold mb-2">Project Description</label>
                <textarea name="proj_des" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">{{ project.proj_des }}</textarea>
            </div>
        
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Project Members</label>
                <select name="members_list[]" multiple required class="w-full p-3 border border-gray-300 rounded-lg"> 
                    {% for employee in employees %}
                    <option value="{{ employee.id }}" {% if employee in project.members.all %}selected{% endif %}>
                        {{ employee.first_name }} {{ employee.last_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Start Date</label>
                <input type="date" name="start_date" required value="{{ project.start_date|date:'Y-m-d' }}"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">End Date</label>
                <input type="date" name="end_date" required value="{{ project.end_date|date:'Y-m-d' }}"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Project Status</label>
                <select required name="status">
                    <option value="">Select status</option>
                    <option value="In Progress" {% if project.status == "In Progress" %}selected{% endif %}>In Progress</option>
                    <option value="Completed" {% if project.status == "Completed" %}selected{% endif %}>Completed</option>
                </select>
            </div>
        
            <button type="submit"
                    class="w-full bg-red-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Submit
            </button>
        </form>
        
    </div>
</div>
{% endblock content %}
