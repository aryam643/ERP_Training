{% extends "website/sidebar.html" %}
{% block title %}
<title>Add Project</title>
{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-r from-neutral-900 via-neutral-800 to-neutral-700">
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md">
        <h2 class="text-4xl font-bold text-center text-gray-800 mb-4">Add Project</h2>

        <form class="max-w-lg mx-auto bg-gray-200 p-6 rounded-lg shadow" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Project Name</label>
                <input type="text" name="project_name" required placeholder="Enter Project Name"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-4">
                <label for="proj_des" class="block text-gray-700 font-semibold mb-2">Project Description</label>
                <textarea name="proj_des" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <!-- Manager Selection -->
            {% comment %} <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Project Manager</label>
                <select name="manager_list" required class="w-full p-3 border border-gray-300 text-black rounded-lg">
                    
                    <option value="">Select a Manager</option>
                    {% for manager in managers %}
                    <option value="{{ manager.id }}">{{ manager.first_name}} {{ manager.last_name }}</option>
                    {% endfor %}
                </select>
            </div> {% endcomment %}

            <!-- Members Selection -->
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Project Members</label>
                <select name="members_list[]" multiple required class="w-full p-3 border border-gray-300 rounded-lg">
                    {% for employee in employees %}
                    <option class="text-black"value="{{ employee.id }}">{{ employee.first_name }} {{ employee.last_name }}</option>
                    {% endfor %}
                </select>
            </div>


            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Start Date</label>
                <input type="date" name="start_date" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">End Date</label>
                <input type="date" name="end_date" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Project Status</label>
                <select required name="status" id="list" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">Select status</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <button type="submit" 
            class="w-full bg-red-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
            Submit
            </button>
        </form>

        {% if messages %}
        <div class="mt-4 p-3 bg-red-100 text-red-700 rounded-lg">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
    </div>
</div>
{% endblock content %}
