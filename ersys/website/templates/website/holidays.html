{% extends "website/sidebar.html" %}

{% block title %}
<title>Holiday Calendar</title>
{% endblock %}

{% block content %}

<!-- Include FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var calendarEl = document.getElementById("calendar");

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth",
            themeSystem: "standard",
            height: 'auto',
            headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek,timeGridDay"
            },
            buttonText: {
                today: 'Today',
                month: 'Month',
                week: 'Week',
                day: 'Day'
            },
            events: "/calendar/events/",  // Fetch from Django
            eventClick: function(info) {
                // Custom modal or tooltip for event details
                Swal.fire({
                    title: info.event.title,
                    text: info.event.extendedProps.description || "No additional details available.",
                    icon: 'info',
                    background: '#262626',
                    color: '#fff',
                    confirmButtonColor: '#dc2626'
                });
            },
            eventColor: '#dc2626',
            eventTextColor: '#ffffff',
            aspectRatio: 1.35,
            displayEventTime: false
        });

        calendar.render();
    });
</script>

<!-- Sweet Alert for enhanced event clicking -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Main Container -->
<div class="flex flex-col items-center min-h-screen bg-gradient-to-b from-neutral-900 via-neutral-800 to-neutral-700 p-6">
    
    <!-- Header Section -->
    <div class="w-full max-w-5xl mb-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-red-600 mb-2">
                    Holiday Calendar
                </h1>
                <p class="text-neutral-400 text-sm tracking-wide">
                    Plan your leaves and stay updated with upcoming holidays
                </p>
            </div>

        </div>
    </div>

    <!-- Info Cards -->

    <div class="w-full max-w-5xl mb-3 grid grid-cols-3 gap-2">
        <div class="bg-neutral-800 p-4 rounded-xl border border-neutral-700">
            <div class="flex items-center space-x-4">
                <div class="bg-red-600 w-12 h-12 rounded-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-neutral-300 font-semibold">Total Leaves</h3>
                    <p class="text-red-400 text-2xl font-bold">6</p>
                </div>
            </div>
        </div>
        <div class="bg-neutral-800 p-4 rounded-xl border border-neutral-700">
            <div class="flex items-center space-x-4">
                <div class="bg-red-600 w-12 h-12 rounded-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-neutral-300 font-semibold">Upcoming</h3>
                    <p class="text-red-400 text-2xl font-bold">1</p>
                </div>
            </div>
        </div>
        <div class="bg-neutral-800 p-4 rounded-xl border border-neutral-700">
            <div class="flex items-center space-x-4">
                <div class="bg-red-600 w-12 h-12 rounded-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-neutral-300 font-semibold">Completed</h3>
                    <p class="text-red-400 text-2xl font-bold">0</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Calendar Container -->

    <div class="bg-white p-3 rounded-xl shadow-2xl w-full max-w-5xl border border-neutral-700">
        <div id="calendar" class="fc-theme-standard"></div>
    </div>

    
</div>

{% endblock %}
