{% extends "website/sidebar.html" %}

{% block title %}
<title>Holiday Calendar</title>
{% endblock %}

{% block content %}

<!-- Include FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var calendarEl = document.getElementById("calendar");
    
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth",
            themeSystem: "standard",
            height: 'auto',
            headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek,timeGridDay"
            },
            buttonText: {
                today: 'Today',
                month: 'Month',
                week: 'Week',
                day: 'Day'
            },
            events: function(fetchInfo, successCallback, failureCallback) {
                fetch("/holidays")
                    .then(response => response.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            successCallback(data);
                        } else {
                            console.error("Unexpected response format:", data);
                            failureCallback();
                        }
                    })
                    .catch(error => {
                        console.error("Error fetching holidays:", error);
                        failureCallback();
                    });
            },
            eventClick: function(info) {
                Swal.fire({
                    title: info.event.title,
                    text: "This is a holiday!",
                    icon: 'info',
                    background: '#262626',
                    color: '#fff',
                    confirmButtonColor: '#dc2626'
                });
            },
            eventColor: '#dc2626',
            eventTextColor: '#ffffff',
            aspectRatio: 1.35,
            displayEventTime: false
        });
    
        calendar.render();
    });
</script>

<!-- Sweet Alert for enhanced event clicking -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Main Container -->
<div class="flex flex-col items-center min-h-screen bg-gradient-to-b from-neutral-900 via-neutral-800 to-neutral-700 p-6">
    
    <!-- Header Section -->
    <div class="w-full max-w-5xl mb-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-red-600 mb-2">
                    Holiday Calendar
                </h1>
                <p class="text-neutral-400 text-sm tracking-wide">
                    Plan your leaves and stay updated with upcoming holidays
                </p>
            </div>

        </div>
    </div>

    <!-- Calendar Container -->

    <div class="bg-white p-3 rounded-xl shadow-2xl w-full max-w-5xl border border-neutral-700">
        <div id="calendar" class="fc-theme-standard"></div>
    </div>

    
</div>

{% endblock %}
